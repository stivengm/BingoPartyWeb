# Blueprint de Render: https://render.com/docs/blueprint-spec
# Un solo servicio: construye Angular y el servidor de Node lo sirve junto con Socket.IO.
services:
  - type: web
    name: bingopartyweb
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
