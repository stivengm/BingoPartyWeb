<div class="content_winner">

    <app-confeti-winner></app-confeti-winner>

    <div class="modal_winner">
        <div class="section_winner">
            <img src="assets/icons/coup.svg" alt="Icono de Copa Ganador">
            <div class="confeti">
                <img src="assets/icons/confeti.svg" alt="Icono de Confeti">
            </div>
        </div>
        <div class="information_winner">
            <h1 class="title_bingo">{{ winnerName ? '¡Bingo!' : 'Fin' }}</h1>
    
            <p class="name_winner">{{ winnerName ? '¡' + winnerName + ' ha ganado!' : 'La partida terminó sin ganador.' }}</p>
        </div>

        <div>

        </div>

        <div class="actions_modal_winner">
            @if (isHost) {
                <button class="btn primary_button" [disabled]="isSending" (click)="newGame()">Nueva partida</button>
            } @else {
                <p class="waiting_host">Esperando a que el host inicie otra partida…</p>
            }
            <button class="btn secondary_button" (click)="goToHome()">Volver al inicio</button>
        </div>

    </div>

</div>
