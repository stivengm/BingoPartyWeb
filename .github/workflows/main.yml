name: CI

# El despliegue lo hace Render (build + servidor en un solo servicio, ver README).
# Este workflow solo valida que el servidor y el front compilen y pasen sus pruebas.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --include=dev

      - name: Server typecheck y tests
        run: npm run server:check && npm run server:test

      - name: Build app
        run: npm run build
